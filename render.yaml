services:
  # 1. Python ML Microservice
  - type: web
    name: kisanai-ml-service
    env: python
    buildCommand: pip install -r ml-service/requirements.txt
    startCommand: cd ml-service && uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: starter
    autoDeploy: true

  # 2. Node.js Express API Backend
  - type: web
    name: kisanai-backend
    env: node
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && node server.js
    plan: starter
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: kisanai-ml-service
          property: host

  # 3. React Vite Frontend
  - type: web
    name: kisanai-frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: kisanai-backend
          property: host
